name: Publish calculator and GeoMesh

on:
  push:
    branches: [main]
    paths:
      - 'it-tax-economics/**'
      - 'geomesh/**'
      - '.github/workflows/publish-it-calculator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "it-calculator-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage calculator at original Pages root and GeoMesh under /geomesh
        run: |
          mkdir -p _pages
          cp -a it-tax-economics/. _pages/
          mkdir -p _pages/geomesh
          cp -a geomesh/. _pages/geomesh/
          test -s _pages/index.html
          test -s _pages/geomesh/index.html
          test -s _pages/geomesh/overhauser.html
          test -s _pages/geomesh/fluxgate.html
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Deploy calculator and GeoMesh
        id: deployment
        uses: actions/deploy-pages@v4
